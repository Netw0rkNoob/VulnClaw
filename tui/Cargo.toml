[package]
name = "vulnclaw-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal workbench for VulnClaw"

[lib]
name = "vulnclaw_tui"
path = "src/lib.rs"

[[bin]]
name = "vulnclaw-tui-native"
path = "src/main.rs"

[[test]]
name = "tui"
path = "../tests/tui/main.rs"

[dependencies]
crossterm = "0.28"
jsonschema = { version = "0.49", default-features = false }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
