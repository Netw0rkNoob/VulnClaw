[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulnclaw"
version = "0.3.8"
description = "AI-powered penetration testing CLI tool for cybersecurity professionals"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "UncleC", email = "iamloli@foxmail.com" },
]
keywords = ["pentest", "security", "ai", "mcp", "cli", "vulnerability", "red-team"]
classifiers = [
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "toml>=0.10.0",
    "jinja2>=3.1.0",
    # streamable-http（及 sse/stdio）MCP 传输依赖 mcp 客户端 SDK；
    # VulnClaw 的 lifecycle/probe 使用 mcp 1.x 时代的符号 streamablehttp_client，
    # mcp>=2.0 已将其改名为 streamable_http_client，故 pin 到 1.x 以保证 HTTP MCP 可用。
    "mcp>=1.0,<2.0",
    # ── 沙箱依赖（python_execute 运行时）──────────────────────────────
    # LLM 在 python_execute 中可直接 import 以下库
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pycryptodome>=3.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "build>=1.2.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
kb = [
    "chromadb>=0.4.0",
]
pdf = [
    # Optional: render reports to PDF via report.pdf_exporter.
    "reportlab>=4.0",
]
traffic = [
    # Optional: sandbox-native traffic evidence backends (MIT/BSD-family).
    # The capture/normalization/tool logic works without these; they enable the
    # live proxy + headless browser backends inside the per-run sandbox.
    "mitmproxy>=10.0",
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/Netw0rkNoob/VulnClaw"
Repository = "https://github.com/Netw0rkNoob/VulnClaw"
Issues = "https://github.com/Netw0rkNoob/VulnClaw/issues"

[project.scripts]
vulnclaw = "vulnclaw.cli.main:app"

[tool.hatch.build]
exclude = [
    "/frontend/node_modules",
    "/frontend/dist",
    "/.test-tmp",
    "/.pytest_cache",
    "/dist",
    "/build",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["vulnclaw"]

[tool.hatch.build.targets.sdist]
include = [
    "/vulnclaw",
    "/frontend",
    "/tests",
    "/scripts",
    "/README.md",
    "/README_EN.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
]
exclude = [
    "/frontend/node_modules",
    "/frontend/dist",
    "/.test-tmp",
    "/.pytest_cache",
    "/dist",
    "/build",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Coverage is opt-in to keep normal runs fast:
#   pytest --cov=vulnclaw --cov-report=term-missing
[tool.coverage.run]
source = ["vulnclaw"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# A floor below current coverage (~74%) so a large regression fails CI without
# being brittle; raise it as coverage climbs.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.\\s*$",
]
