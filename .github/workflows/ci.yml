name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps
        run: python -m pip install --upgrade pip

      - name: Install backend package
        run: pip install -e ".[dev,web]"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Ruff
        run: ruff check vulnclaw tests

      - name: Execution boundary check
        run: python scripts/verify_execution_boundary.py

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Pytest
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        run: pytest -q

      - name: Pytest with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pytest -q --cov=vulnclaw --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: true
          use_oidc: true

  rust-tui:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for fake backend tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format check
        working-directory: tui
        run: cargo fmt -- --check

      - name: Rust Clippy
        working-directory: tui
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust TUI tests
        working-directory: tui
        run: cargo test
